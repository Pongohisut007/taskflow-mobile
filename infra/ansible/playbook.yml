---
# Configures the host Terraform provisions (infra/terraform): Node.js, Docker,
# and the taskflow-api image built by the Lab 07 Build Image stage.
# Inventory: inventory/terraform.py (built from `terraform output -json`).
- name: Configure the taskflow-api host
  hosts: taskflow_app
  become: true
  vars:
    node_major: 22
    # Jenkins passes the exact tag it built: -e app_image=$IMAGE_REPO:$IMAGE_TAG
    app_image: localhost:5001/taskflow-api:latest
    # Set false on hosts without systemd (e.g. a container stand-in).
    docker_manage_service: true

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add NodeSource repository for Node.js {{ node_major }}
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_{{ node_major }}.x
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

    - name: Install Node.js and Docker
      ansible.builtin.apt:
        name:
          - nodejs
          - docker.io
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      when: docker_manage_service | bool

    - name: Pull the taskflow-api image
      ansible.builtin.command: docker pull {{ app_image }}
      register: docker_pull
      changed_when: "'Downloaded newer image' in docker_pull.stdout"

    - name: Read installed versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - node --version
        - docker --version
        - docker image inspect --format '{{ '{{' }}.Id{{ '}}' }}' {{ app_image }}
      register: versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"
