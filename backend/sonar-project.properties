sonar.projectKey=taskflow-api
sonar.projectName=taskflow-api

sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The coverage quality gate (>= 70%) is scoped to the tasks API plus the root
# controller; the older modules have no unit tests yet and are excluded here.
sonar.coverage.exclusions=\
  src/main.ts,\
  **/*.module.ts,\
  src/auth/**,\
  src/banner/**,\
  src/cart/**,\
  src/categories/**,\
  src/common/**,\
  src/database/**,\
  src/favorites/**,\
  src/iap/**,\
  src/ingredients/**,\
  src/orders/**,\
  src/payments/**,\
  src/recipe-access/**,\
  src/recipes/**,\
  src/reviews/**,\
  src/uploads/**,\
  src/users/**
