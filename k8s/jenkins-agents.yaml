# Lab 09: namespace + least-privilege ServiceAccount the Jenkins Kubernetes
# cloud uses to start and stop ephemeral agent pods.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-manager
  namespace: jenkins-agents
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-manager
  namespace: jenkins-agents
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agent-manager
---
# Long-lived token for the Jenkins credential 'k8s-jenkins-agents' (Secret text).
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-token
  namespace: jenkins-agents
  annotations:
    kubernetes.io/service-account.name: jenkins
type: kubernetes.io/service-account-token
