# ---------- Postgres (ใช้ร่วมกันทั้ง blue และ green) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - { name: POSTGRES_DB, value: dev }
        - { name: POSTGRES_USER, value: root }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: taskflow-secrets, key: DB_PASSWORD } }
        ports: [{ containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "root", "-d", "dev"] }
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ---------- App: blue ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: taskflow-blue }
spec:
  replicas: 2
  selector: { matchLabels: { app: taskflow, color: blue } }
  template:
    metadata: { labels: { app: taskflow, color: blue } }
    spec:
      containers:
      - name: app
        image: localhost:5001/taskflow-api:3b597c7
        ports: [{ containerPort: 3000 }]
        env:
        - { name: PORT, value: "3000" }
        - { name: DB_HOST, value: postgres }
        - { name: DB_PORT, value: "5432" }
        - { name: DB_USER, value: root }
        - { name: DB_NAME, value: dev }
        envFrom:
        - secretRef: { name: taskflow-secrets }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 5
          periodSeconds: 5
---
# ---------- App: green ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: taskflow-green }
spec:
  replicas: 2
  selector: { matchLabels: { app: taskflow, color: green } }
  template:
    metadata: { labels: { app: taskflow, color: green } }
    spec:
      containers:
      - name: app
        image: localhost:5001/taskflow-api:3b597c7
        ports: [{ containerPort: 3000 }]
        env:
        - { name: PORT, value: "3000" }
        - { name: DB_HOST, value: postgres }
        - { name: DB_PORT, value: "5432" }
        - { name: DB_USER, value: root }
        - { name: DB_NAME, value: dev }
        envFrom:
        - secretRef: { name: taskflow-secrets }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 5
          periodSeconds: 5
---
# ---------- Services ----------
apiVersion: v1
kind: Service
metadata: { name: taskflow }
spec:
  selector: { app: taskflow, color: blue }
  ports: [{ port: 8080, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata: { name: taskflow-blue }
spec:
  selector: { app: taskflow, color: blue }
  ports: [{ port: 8080, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata: { name: taskflow-green }
spec:
  selector: { app: taskflow, color: green }
  ports: [{ port: 8080, targetPort: 3000 }]
